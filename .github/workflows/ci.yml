name: CI

# Build + test + content walkthroughs + service smoke-boot + fmt/clippy gate on
# every push and PR to ALL branches, so no merge lands without a green build +
# passing tests. See issue #14.
on:
  pull_request:
    branches: ['**']

# Cancel superseded in-flight runs for the same ref so a fresh push doesn't
# leave stale runs burning runner minutes. push and PR refs differ, so a PR's
# run is not cancelled by pushes to its source branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gate only needs to read the repo.
permissions:
  contents: read

# The six gates are independent jobs (no `needs:` between them) so they run in
# parallel and ALL signals surface even when one fails — there is no fail-fast
# coupling across separate jobs.
#
# Every job uses actions-rust-lang/setup-rust-toolchain@v1, which:
#   * installs the toolchain pinned in rust-toolchain.toml (1.95.0 + the rustfmt
#     and clippy components) because no `toolchain:` input is given, and
#   * caches the cargo registry + target/ by default (Swatinem/rust-cache under
#     the hood), keyed per job, so the vendored-Lua / bundled-SQLite C builds are
#     not recompiled every run.
# `rustflags: ""` neutralizes that action's default RUSTFLAGS=-D warnings, which
# would otherwise turn ordinary build/test warnings into hard errors. Deny-warnings
# is enforced ONLY in the clippy job, via the explicit `-- -D warnings` below.
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      # --locked fails if Cargo.lock is stale or missing (Cargo.lock is committed).
      - run: cargo build --workspace --all-targets --locked

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo test --workspace --locked

  # content-test is a standalone `main()` driver (not a `#[test]`), so the `test`
  # job above never runs it. It drives the real map-server content engine
  # in-process through the SEQ_000 tutorial, the SEQ_005 live-combat force-kill,
  # and the SEQ_010 hand-off for all three starting-city MSQ routes, exiting
  # non-zero on any failed walkthrough case. Debug profile: the SEQ_005 legs sleep
  # on a real wall clock regardless of profile, so a release build only adds
  # compile time. `timeout-minutes` bounds those wall-clock beats so a stuck
  # director fails instead of burning the 6h default.
  content-test:
    name: content-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      # Run from the repo root so it resolves ./scripts/lua + ./scripts/tests.
      - run: cargo run --locked -p content-test

  # smoke boots each service in `--smoke` mode against a throwaway SQLite DB and
  # asserts a SMOKE_OK marker + exit 0 (a bind/config/DB/catalog-load failure is
  # reported as SMOKE_FAIL → non-zero). This covers the end-to-end boot path the
  # unit-level `test` job cannot. PROFILE=debug avoids a second release build.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: PROFILE=debug scripts/smoke-local.sh
