[package]
name = "content-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "content-test"
path = "src/main.rs"

[dependencies]
# The map server is a lib + thin bin; we embed its Lua content engine, and
# enable its `testkit` feature for the Tier-2 combat-walkthrough facade
# (`map_server::testkit::OpenerCombat`).
map-server = { path = "../map-server", features = ["testkit"] }
common.workspace = true
mlua.workspace = true
anyhow.workspace = true
clap.workspace = true
# The combat facade is async; the spec runner blocks on it via a runtime.
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
